name: SIP Alarm Caller
version: "0.1.0"
slug: sip_alarm_caller
description: Ruft bei Alarm (z.B. Alarmo) per SIP an und spricht einen TTS-Text, wiederholt bis quittiert.
url: https://github.com/leftclickag/PhoneAutomation-SIP
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
homeassistant_api: true
host_network: true
ports:
  8099/tcp: 8099
options:
  sip_server: ""
  sip_user: ""
  sip_password: ""
  sip_auth_user: ""
  sip_outbound_proxy: ""
  sip_transport: udp
  numbers: []
  default_message: "Achtung! Es wurde ein Alarm ausgelöst. Bitte drücke die Taste 1 zum Quittieren."
  message_repeats: 3
  tts_engine: tts.piper
  tts_language: de_DE
  ring_timeout: 40
  retry_interval: 120
  max_rounds: 10
  ack_digit: "1"
  api_token: ""
schema:
  sip_server: str
  sip_user: str
  sip_password: password
  sip_auth_user: str?
  sip_outbound_proxy: str?
  sip_transport: list(udp|tcp|tls)
  numbers:
    - str
  default_message: str
  message_repeats: int(1,10)
  tts_engine: str
  tts_language: str
  ring_timeout: int(10,120)
  retry_interval: int(10,3600)
  max_rounds: int(1,100)
  ack_digit: match(^[0-9*#]$)
  api_token: password?
